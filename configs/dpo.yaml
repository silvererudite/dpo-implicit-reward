# DPO policy pi_theta -> implicit reward. Sweep --beta {0.05,0.1,0.3,0.5} and --budget {2k,8k,32k}.
base_model: Qwen/Qwen2.5-0.5B
sft_dir: outputs/sft                    # start from the shared reference policy
output_root: outputs

# match SFT/RM LoRA + optimization for budget-matched comparison
epochs: 1
batch_size: 4
grad_accum: 4
lr: 5.0e-5
max_length: 1024
max_prompt_length: 512
save_steps: 250                         # intermediate checkpoints -> training-progress ablation
seed: 0
report_to: none
bf16: true          # Ampere (g5/A10G, A100). On a T4 set bf16:false, fp16:true
fp16: false
